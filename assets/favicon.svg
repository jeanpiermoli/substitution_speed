<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <style>
      :root {
        --icon-bg: #12151a;
        --icon-accent: #5b8ea8;
        --icon-ring: rgba(91, 142, 168, 0.35);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --icon-bg: #ffffff;
          --icon-accent: #3d6f88;
          --icon-ring: rgba(61, 111, 136, 0.25);
        }
      }
      .bg { fill: var(--icon-bg); }
      .stroke-accent { stroke: var(--icon-accent); }
      .fill-accent { fill: var(--icon-accent); }
      .fill-ring { fill: var(--icon-ring); }
    </style>
  </defs>

  <!-- Fondo con bordes redondeados suaves -->
  <rect class="bg" width="32" height="32" rx="8"/>
  <rect class="stroke-accent" x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke-opacity="0.25"/>

  <!-- Onda / Curva de función matemática -->
  <path class="stroke-accent" d="M4 18h4l3-9 5 16 4-11 3 5h5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodo característico con halo -->
  <circle class="fill-ring" cx="20" cy="9" r="4.5"/>
  <circle class="fill-accent" cx="20" cy="9" r="2.2"/>
</svg>
